name: leadscaptain

x-app: &app
  build:
    context: .
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: leadscaptain-app:dev
  volumes:
    - .:/var/www/html
  restart: unless-stopped

services:
  app:
    <<: *app
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---- Queue stack: `docker compose --profile queue up -d` ----
  redis:
    image: redis:7-alpine
    profiles: ["queue"]
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  horizon:
    <<: *app
    profiles: ["queue"]
    command: ["php", "artisan", "horizon"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- Standalone package tests (no host app): `docker compose --profile test run --rm package-tests` ----
  package-tests:
    build:
      context: ./packages/leadscaptain
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: leadscaptain-package:test
    profiles: ["test"]
    volumes:
      - ./packages/leadscaptain:/package
      - package-vendor:/package/vendor
    command: ["sh", "-c", "composer install --no-interaction --prefer-dist && vendor/bin/phpunit"]

volumes:
  db-data:
  redis-data:
  package-vendor:
