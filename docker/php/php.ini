; Application PHP settings (loaded after defaults)
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 60
expose_php = Off
date.timezone = UTC

; Send PHP errors to stderr so they show in `docker compose logs`
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
